# MViT v2 S with HOG-based MaskFeat (MVM) Pretraining Configuration
# Based on "Masked Feature Prediction for Self-Supervised Visual Pre-Training"
# HOG provides strong local pattern features without external models

# Training parameters
num_epochs: !!int 100  # Longer training for self-supervised learning
model_name: !!str mvit_v2_s
data_filename: !!str /media/data1/datasets/CathEF/CathEF_MHI_UCSF_2016-to-july-2022-and-2023-08-30-post-CathEF_alpha_filtered_30days.csv
output_dir: !!str "outputs_hog_mvm_pretrain"
root: !!str "."
datapoint_loc_label: !!str FileName
device: !!str cuda
seed: !!int 42
resume: !!bool false
binary_threshold: !!float 0.5

# Dataset parameters
apply_mask: !!bool false
weighted_sampling: !!bool false
debug: !!bool false
test_time_augmentation: !!bool false
run_test: !!bool false

# Task configuration - MVM with HOG targets for self-supervised pretraining
task: !!str masked_video_modeling
loss: !!str masked_video_modeling

# Dummy labels for MVM (not used but might be required by data loading)
target_label: !!null null
label_loc_label: !!null null

# MViT specific parameters
frames: !!int 16  # MViT requires 16 frames
resize: !!int 224  # MViT standard input size
period: !!int 2
pretrained: !!bool False  # Start from scratch for pretraining
view_count: !!int 1  # Single view for standard training
mean: [112.24039459228516, 112.24039459228516, 112.24039459228516]
std: [39.012229919433594, 39.012229919433594, 39.012229919433594]

# MVM with HOG configuration (MaskFeat)
mvm_config:
  hidden_size: !!int 768  # MViT v2 S hidden dimension
  decoder_hidden_size: !!int 384  # Lightweight decoder
  decoder_layers: !!int 4
  decoder_heads: !!int 6
  mask_ratio: !!float 0.4  # MaskFeat uses 40% masking for video
  mask_type: !!str cube  # Cube masking for spatiotemporal data
  use_patch_projection: !!bool false  # False for feature reconstruction (MViT)
  target_type: !!str hog  # HOG features as target (MaskFeat)
  patch_size: !!int 16
  num_frames: !!int 16
  image_size: !!int 224
  mask_token_learnable: !!bool true
  norm_predict_loss: !!bool false  # HOG already normalized
  
  # HOG-specific configuration (following MaskFeat paper)
  hog_config:
    orientations: !!int 9  # 9 orientation bins (0-180 degrees)
    pixels_per_cell: [8, 8]  # 8x8 pixel cells
    cells_per_block: [1, 1]  # Local normalization per cell
    block_norm: !!str L2  # L2 normalization (essential for HOG)
    use_color: !!bool true  # RGB HOG (slight improvement over grayscale)

# Optimizer configuration for pretraining (following MaskFeat)
optimizer: !!str AdamW
weight_decay: !!float 0.05  # Standard for MaskFeat
betas: [0.9, 0.95]  # MaskFeat-style betas for AdamW
num_workers: !!int 8
batch_size: !!int 8  # Larger batch size for SSL
lr: !!float 0.0008  # MaskFeat uses 8e-4 for video
lr_schedule: !!str cosine
scheduler_type: !!str cosine
warmup_epochs: !!int 30
min_lr: !!float 0.00001

# 3D RoPE Configuration (optional - can enable for better position encoding)
use_rope: !!bool true
rope_base: !!float 10000.0
rope_temporal_scale: !!float 1.0
rope_normalize_mode: !!str separate

# Mixed precision and gradient accumulation
use_amp: !!bool true
gradient_accumulation_steps: !!int 2
gradient_clip_val: !!float 0.02  # Small clipping for HOG targets

# Data augmentation for SSL (minimal for MaskFeat)
augment: !!bool true
crop_size: !!int 224
horizontal_flip_prob: !!float 0.5
vertical_flip_prob: !!float 0.0
# MaskFeat works best with minimal augmentation
rotation_degrees: !!int 0
brightness: !!float 0.0
contrast: !!float 0.0
saturation: !!float 0.0
hue: !!float 0.0
random_erase_prob: !!float 0.0
random_erase_scale: [0.02, 0.33]

# Validation parameters
val_split: !!float 0.1
eval_every_n_epochs: !!int 5
save_best_model: !!bool true
save_checkpoint_every_n_epochs: !!int 10

# Logging
project: !!str "orion-mvit-hog-mvm-pretraining"
entity: !!str "mhi_ai"
ssl_log_interval: !!int 50  # Log SSL metrics every N batches

# Masking strategy (following MaskFeat paper)
masking_config:
  strategy: !!str cube  # Cube masking for video
  min_num_patches: !!int 16  # Minimum patches per mask
  max_num_patches: !!null null  # Use default
  min_aspect: !!float 0.3  # Aspect ratio range
  max_aspect: !!float 3.33

# Frame sampling strategy for videos
frame_sampling:
  strategy: !!str uniform
  clip_duration: !!float 2.0
  clips_per_video: !!int 1

# Early stopping (optional - usually not used in SSL)
early_stopping:
  enabled: !!bool false
  patience: !!int 20
  min_delta: !!float 0.001

# Model saving
save_strategy: !!str best
keep_last_n_checkpoints: !!int 3

# Distributed training
distributed: !!bool true
backend: !!str nccl
find_unused_parameters: !!bool true  # Needed for RoPE

# Memory optimization
pin_memory: !!bool true
persistent_workers: !!bool true
prefetch_factor: !!int 2

# HOG visualization settings
visualize_hog:
  enabled: !!bool true
  num_samples: !!int 4
  save_every_n_epochs: !!int 5
  save_path: !!str "outputs_hog_mvm_pretrain/hog_visualizations"
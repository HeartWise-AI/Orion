# X3D Debug Binary Classification after MVM Pretraining
# Fine-tune the pretrained encoder for binary LVEF classification (< 40% vs ≥ 40%)

# Training parameters
num_epochs: !!int 25
model_name: !!str mvit_v2_s
data_filename: !!str /media/data1/datasets/CathEF/CathEF_MHI_UCSF_2016-to-july-2022-and-2023-08-30-post-CathEF_alpha_filtered_30days.csv
output_dir: !!str "outputs_mvit_debug_binary/mvit_v2_s_16_16_3_AdamW_new_20250903-181753_xz28ymfj"
root: !!str "."
datapoint_loc_label: !!str FileName
label_loc_label: [y_true_cat, Value]
binary_threshold: !!float 0.5
device: !!str cuda
seed: !!int 42
resume: !!bool false

# Load pretrained MVM checkpoint
pretrained: !!bool true
checkpoint_path: !!str "/media/data1/models/DeepCoro_HOG_MVIT/mvit_v2_s_8_16_2_AdamW_new_20250826-233853_wsr2fciq/best.pt"
load_mvm_encoder_only: !!bool true

# Task configuration
task: !!str regression
loss: !!str multi_head
num_classes: !!int 1

# Head structure configuration
head_structure:
  y_true_cat: !!int 1
  Value: !!int 1

# Head task configuration
head_task:
  Value: !!str regression
  y_true_cat: !!str classification

# Loss structure configuration
loss_structure:
  Value: !!str l1
  y_true_cat: !!str bce_logit

# Head weights configuration
head_weights:
  Value: !!float 1.0
  y_true_cat: !!float 1.0

# Regression head initialization helpers
regression_head_bias:
  Value: !!float 0.5

regression_value_scale:
  Value: !!float 0.01

# Video input configuration
frames: !!int 16
resize: !!int 224
crop_size: !!int 224
period: !!int 2
view_count: !!int 1
mean: [120.905205, 120.905205, 120.905205]
std: [40.97189, 40.97189, 40.97189]

# Optimizer configuration
optimizer: !!str AdamW
weight_decay: !!float 0.0004267478201985343
num_workers: !!int 16
batch_size: !!int 16
lr: !!float 0.000025368753145939587

# Learning rate scheduler
scheduler_type: !!str cosine_warm_restart
warmup_epochs: !!int 2
min_lr: !!float 0.000001

# 3D RoPE configuration
use_rope: !!bool true
rope_base: !!float 10000.0
rope_temporal_scale: !!float 1.0
rope_normalize_mode: !!str separate

# Mixed precision and stabilization
use_amp: !!bool true
gradient_accumulation_steps: !!int 4
gradient_clip_val: !!float 1.0

# Data augmentation flags
rand_augment: !!bool false
horizontal_flip_prob: !!float 0.0
vertical_flip_prob: !!float 0.0
transforms: []

# Validation parameters
val_split: !!float 0.2
eval_every_n_epochs: !!int 1
save_best_model: !!bool true
save_strategy: !!str best
save_best: !!str loss
early_stopping_patience: !!int 5

# Logging
project: !!str "orion-x3d-debug-binary"
entity: !!str "mhi_ai"
tag: !!str "x3d_debug_binary_classification"
log_interval: !!int 20

# Evaluation metrics
metrics_control:
  n_bootstrap: !!int 100
  q_bootstrap: !!float 0.05
  optim_thresh: !!str g_mean
  plot_pred_distribution: !!bool true
  plot_metrics_moving_thresh: !!bool false

# Model saving
keep_last_n_checkpoints: !!int 3

# Distributed training
backend: !!str nccl

# Memory optimization
pin_memory: !!bool true
persistent_workers: !!bool true

# Sampling
weighted_sampling: !!bool false

# Inference-time options
test_time_augmentation: !!bool false

# Debugging
debug: !!bool false

# Label mappings
labels_map:
  Value: !!null null
  y_true_cat:
    0: !!int 0
    1: !!int 1

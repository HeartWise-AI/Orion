program:
  orion/utils/video_training_and_eval.py
name: "Loss_Weight_Bayes_Sweep"
method: "bayes" # Bayesian optimization for efficient search
metric:
  name: "best_val_loss"
  goal: "minimize"
parameters:
  model_name:
    values: ["mvit_v2_s"]
  
  # Loss weight ratios - use log distributions for better exploration
  # Bayesian optimization will learn which ratios work best
  head_weights_y_true_cat:
    distribution: "log_uniform_values"
    min: 0.01
    max: 100.0
  head_weights_Value:
    distribution: "log_uniform_values"
    min: 0.01
    max: 100.0
  # This allows exploring ratios from 1:10000 to 10000:1
  
  # Fixed hyperparameters (using your proven values)
  lr:
    values: [0.00002786988178725705]  # Your proven LR
  scheduler_type:
    values: ["cosine_warm_restart"]  # Your proven scheduler
  optimizer:
    values: ["AdamW"]
  weight_decay:
    values: [0.0003845182987994549]  # Your proven weight decay
  batch_size:
    values: [16,32,64]
  period:
    values: [1,2,3]
  
  # Regression-specific parameters (fixed)
  regression_head_bias_Value:
    values: [0.5]
  regression_value_scale_Value:
    values: [0.01]
early_terminate:
  type: hyperband
  min_iter: 5  # Increased from 3 to allow more training
command:
  - notebooks/config/runner_sweep.sh
  - ${program}
  - "notebooks/config/config_x3d_debug_binary_classification.yaml"
  - ${args}

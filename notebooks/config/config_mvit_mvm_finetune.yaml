# X3D-M Fine-tuning Configuration after MVM Pretraining
# Fine-tune the MVM pretrained model for downstream classification

# Training parameters
num_epochs: !!int 30  # Shorter fine-tuning
model_name: !!str x3d_m
data_filename: !!str /volume/orion_multi-class_multi-output/data/dev_set.csv
output_dir: !!str "outputs_mvm_finetune"
root: !!str "."
datapoint_loc_label: !!str FileName
label_loc_label: [contrast_agent, main_structure, stent_presence]
binary_threshold: !!float 0.5
device: !!str cuda
seed: !!int 42

# Load pretrained MVM checkpoint
pretrained: !!bool true  # Use ImageNet pretrained weights for x3d_m
checkpoint_path: !!null null  # Not loading from MVM checkpoint for now
load_mvm_encoder_only: !!bool false  # Not loading MVM weights

# Task configuration - downstream classification
task: !!str classification
loss: !!str multi_head

# X3D specific parameters
frames: !!int 16  # X3D works with multiples of 8
resize: !!int 224
period: !!int 2
view_count: !!int 1
mean: [0.45, 0.45, 0.45]  # ImageNet normalization for X3D
std: [0.225, 0.225, 0.225]

# Optimizer configuration for fine-tuning
optimizer: !!str AdamW
weight_decay: !!float 0.05
num_workers: !!int 8
batch_size: !!int 4
lr: !!float 0.00005  # Lower learning rate for fine-tuning
lr_schedule: !!str cosine
warmup_epochs: !!int 5
min_lr: !!float 0.000001

# Layer-wise learning rate decay (optional)
layer_decay: !!float 0.75  # Each layer gets lr * (layer_decay ^ depth)
layer_decay_enabled: !!bool true

# Gradual unfreezing for fine-tuning
video_freeze_schedule: !!str linear
video_freeze_start: !!float 0.8  # Start with 80% frozen
video_freeze_end: !!float 0.0   # End fully trainable
video_freeze_warmup_epochs: !!int 10

# 3D RoPE Configuration (disabled for X3D)
use_rope: !!bool false
rope_base: !!float 10000.0
rope_temporal_scale: !!float 1.0
rope_normalize_mode: !!str separate

# Label mappings for downstream task
labels_map:
  contrast_agent:
    "yes": !!int 1
    "no": !!int 0
  main_structure:
    Left Coronary: !!int 0
    Right Coronary: !!int 1
    Graft: !!int 2
    Catheter: !!int 3
    Femoral: !!int 4
  stent_presence:
    present: !!int 1
    absent: !!int 0

# Head structure configuration
head_structure:
  contrast_agent: !!int 1    # Binary classification
  main_structure: !!int 5    # Multi-class classification
  stent_presence: !!int 1    # Binary classification

# Head task configuration (specify task type for each head)
head_task:
  contrast_agent: !!str classification
  main_structure: !!str classification
  stent_presence: !!str classification

# Loss structure configuration
loss_structure:
  contrast_agent:
    type: !!str bce_with_logits
    weight: !!float 1.0
  main_structure:
    type: !!str cross_entropy
    weight: !!float 1.0
  stent_presence:
    type: !!str bce_with_logits
    weight: !!float 1.0

# Mixed precision and gradient accumulation
use_amp: !!bool true
gradient_accumulation_steps: !!int 4
gradient_clip_val: !!float 1.0

# Data augmentation (lighter for fine-tuning)
augment: !!bool true
crop_size: !!int 224
horizontal_flip_prob: !!float 0.5
vertical_flip_prob: !!float 0.0
rotation_degrees: !!int 10
brightness: !!float 0.2
contrast: !!float 0.2
saturation: !!float 0.2
hue: !!float 0.1

# Validation parameters
val_split: !!float 0.2
eval_every_n_epochs: !!int 1
save_best_model: !!bool true
early_stopping_patience: !!int 7

# Logging
wandb_project: !!str "orion-mvit-mvm-finetune"
wandb_entity: !!null null
log_interval: !!int 20
save_checkpoint_every_n_epochs: !!int 5

# Evaluation metrics
track_metrics:
  - accuracy
  - precision
  - recall
  - f1_score
  - auc_roc
  - confusion_matrix

# Model saving
save_strategy: !!str best
keep_last_n_checkpoints: !!int 3

# Distributed training
distributed: !!bool true
backend: !!str nccl

# Memory optimization
pin_memory: !!bool true
persistent_workers: !!bool true

# Label smoothing (optional)
label_smoothing: !!float 0.1

# Mixup/CutMix augmentation (optional)
mixup_alpha: !!float 0.0  # Set > 0 to enable
cutmix_alpha: !!float 0.0  # Set > 0 to enable